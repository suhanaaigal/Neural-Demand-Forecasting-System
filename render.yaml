services:
  - type: web
    name: neural-demand-forecasting-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /openapi.json

  - type: web
    name: neural-demand-forecasting-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /
    envVars:
      - key: DEMAND_FORECAST_URL
        value: https://neural-demand-forecasting-api.onrender.com/predict_sequence
      - key: DEMAND_FORECAST_TIMEOUT_SECONDS
        value: "120"
